<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新标签页</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: #fafafa;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: safe center;
    justify-content: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1b1b1b; }
  }

  /* 网格 */
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 92px);
    gap: 18px 10px;
    justify-content: center;
    box-sizing: border-box;
    width: 100%;
    max-width: 960px;
    padding: 40px 20px;
  }
  .tile {
    box-sizing: border-box;
    width: 92px; cursor: pointer; position: relative;
    border-radius: 10px; padding: 6px 2px 4px;
    text-align: center; user-select: none;
  }
  .tile:hover .thumb { box-shadow: 0 2px 10px rgba(0,0,0,.13); }
  .thumb {
    width: 56px; height: 56px; margin: 0 auto;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  @media (prefers-color-scheme: dark) {
    .thumb { background: #2a2a2a; }
  }
  .thumb img { width: 32px; height: 32px; border-radius: 6px; object-fit: contain; }
  .letter {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 17px; font-weight: 600;
  }
  .tname {
    margin-top: 7px;
    font-size: 12px; line-height: 1.35; color: #444;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-all;
  }
  @media (prefers-color-scheme: dark) {
    .tname { color: #b8b8b8; }
  }

  /* 删除角标：仅编辑态显示，平时完全隐形且不可点 */
  .op {
    position: absolute; top: -5px; right: 6px;
    width: 20px; height: 20px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    font-size: 13px; line-height: 20px; text-align: center;
    color: #fff; background: #e5484d;
    opacity: 0; pointer-events: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  body.editing .op { opacity: 1; pointer-events: auto; }

  /* 常驻添加按钮：与图标同尺寸，排在最后 */
  #addTile {
    box-sizing: border-box; padding: 6px 2px 4px;
    cursor: pointer; user-select: none;
  }
  #addTile .plus {
    width: 56px; height: 56px; margin: 0 auto;
    border-radius: 14px; box-sizing: border-box;
    border: 2px dashed #b8b8b8;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #999;
  }
  #addTile:hover .plus { border-color: #3b82f6; color: #3b82f6; }
  @media (prefers-color-scheme: dark) {
    #addTile .plus { border-color: #555; color: #888; }
    #addTile:hover .plus { border-color: #3b82f6; color: #3b82f6; }
  }

  /* 编辑模式开关：右下角圆形按钮 */
  #modeBtn {
    position: fixed; right: 22px; bottom: 22px;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; cursor: pointer;
    font-size: 17px;
    background: #fff; color: #666;
    box-shadow: 0 1px 5px rgba(0,0,0,.15);
    opacity: .4; transition: opacity .15s;
  }
  #modeBtn:hover { opacity: .95; }
  body.editing #modeBtn { background: #3b82f6; color: #fff; opacity: 1; }
  @media (prefers-color-scheme: dark) {
    #modeBtn { background: #2a2a2a; color: #bbb; }
    body.editing #modeBtn { background: #3b82f6; color: #fff; }
  }

  /* 编辑中提示条 */
  #editHint {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: rgba(30,30,30,.85); color: #fff;
    font-size: 12.5px; padding: 7px 16px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  body.editing #editHint { opacity: 1; }

  /* 弹窗 */
  #mask {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.35);
    align-items: center; justify-content: center; z-index: 9;
  }
  #mask.show { display: flex; }
  #modal {
    background: #fff; border-radius: 14px; padding: 20px;
    width: 300px; box-shadow: 0 8px 30px rgba(0,0,0,.2);
  }
  @media (prefers-color-scheme: dark) {
    #modal { background: #2a2a2a; }
  }
  #modal label { display: block; font-size: 12px; margin: 12px 0 4px; color: #888; }
  #modal input[type=text] {
    width: 100%; box-sizing: border-box; padding: 7px 9px;
    border: 1px solid #ccc; border-radius: 8px; font-size: 14px;
    background: transparent; color: inherit;
  }
  @media (prefers-color-scheme: dark) {
    #modal input[type=text] { border-color: #555; }
  }
  #modal .row { display: flex; gap: 10px; margin-top: 18px; }
  #modal button {
    flex: 1; padding: 8px 0; border-radius: 8px; border: none;
    cursor: pointer; font-size: 14px;
  }
  #saveBtn { background: #3b82f6; color: #fff; }
  #cancelBtn { background: #eee; color: #555; }
  @media (prefers-color-scheme: dark) {
    #cancelBtn { background: #3a3a3a; color: #ccc; }
  }
  #delBtn { flex: 1; background: none; color: #e5484d; }
</style>
</head>
<body>
<div id="grid"></div>

<button id="modeBtn" title="编辑快捷方式">✎</button>
<div id="editHint">编辑中 · 点图标修改，角标 × 删除，右下角对钩完成</div>

<div id="mask">
  <div id="modal">
    <label>名称</label>
    <input type="text" id="fName" maxlength="30">
    <label>网址</label>
    <input type="text" id="fUrl" placeholder="bilibili.com 或 https://...">
    <label>图标（可选，留空则自动抓网站图标）</label>
    <input type="file" id="fIcon" accept="image/*" style="font-size:12px">
    <div class="row">
      <button id="delBtn" style="display:none">删除</button>
      <button id="cancelBtn">取消</button>
      <button id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script src="nav.js"></script>
</body>
</html>
